<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>identiGO Pmt. Akadémia</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    img {
      max-width: 200px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 10px 0;
      color: #333;
    }
    .event {
      margin-top: 20px;
      font-size: 1.2em;
      color: #444;
    }
    .zoom-link {
      margin-top: 15px;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    a {
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3em;
      color: #0066cc;
    }
    .icon-btn:hover {
      color: #004d99;
    }
    .redirect-note {
      margin-top: 20px;
      font-size: 0.95em;
      color: #666;
    }
    .countdown {
      font-weight: bold;
      color: #333;
    }

  </style>
</head>
<body>
  <div class="container">
    <img src="../identigo_logo_square_1200x1200_transparent.png" alt="identiGO logo">
    <h1>Pmt. ellenőrző lista évzáráshoz</h1>
    <div class="zoom-link">
      <a id="zoomLink" href="https://akademia.identigo.hu/landing/identigo_pmt_ellenorzo_lista.pdf" target="_blank">Letöltés</a>
    </div>
    <div class="redirect-note">
      Automatikus letöltés <span class="countdown" id="countdown"></span> másodperc múlva...
    </div>
  </div>

  <script>
    // Countdown + redirect
    let timeLeft = 4;
    const countdownEl = document.getElementById("countdown");
    const zoomLink = document.getElementById("zoomLink").href;

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = zoomLink;
      }
    }, 1000);
  </script>
</body>
</html>
